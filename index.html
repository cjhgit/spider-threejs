<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蜘蛛结网 · three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2f2f2;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 10px; font-size: 13px; color: #666; user-select: none;
    background: rgba(255, 255, 255, 0.85); padding: 6px 8px; border-radius: 6px; z-index: 1;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  #ui.show { opacity: 1; pointer-events: auto; }
  #phase { display: block; margin-bottom: 6px; }
  #ui button { font: inherit; font-size: 12px; margin-right: 4px; padding: 2px 8px; border: 1px solid #ccc;
    background: #fff; color: #555; border-radius: 4px; cursor: pointer; }
  #ui button.on { background: #333; color: #fff; border-color: #333; }
</style>
<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.164.1/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <span id="phase"></span>
  <span id="speeds"></span>
  <button id="restart">重新开始</button>
</div>
<script type="module">
import * as THREE from 'three';

// ---------------- 渲染器 / UI ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0xf2f2f2, 1);
document.body.appendChild(renderer.domElement);

const phaseEl = document.getElementById('phase');
const speedsEl = document.getElementById('speeds');
const SPEEDS = [1, 2, 5, 10, 30];
let speedMul = 1;
const speedBtns = SPEEDS.map(m => {
  const b = document.createElement('button');
  b.textContent = m + '×';
  b.onclick = () => { speedMul = m; speedBtns.forEach((x, i) => x.classList.toggle('on', SPEEDS[i] === m)); };
  speedsEl.appendChild(b);
  return b;
});
speedBtns[0].classList.add('on');
document.getElementById('restart').onclick = () => init();
const uiEl = document.getElementById('ui');
const setUi = e => uiEl.classList.toggle('show', e.clientY < innerHeight / 2);
addEventListener('mousemove', setUi);
document.addEventListener('mouseleave', () => uiEl.classList.remove('show'));
const setPhase = t => { phaseEl.textContent = t; };

// ---------------- 数学工具 ----------------
const V2 = (x, y) => ({ x, y });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp2 = (a, b, t) => V2(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const TAU = Math.PI * 2;
const angDiff = (a, b) => {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
};
const approachAngle = (a, b, max) => a + clamp(angDiff(b, a), -max, max);

function segIntersect(p0, p1, a, b) {
  const rx = p1.x - p0.x, ry = p1.y - p0.y, sx = b.x - a.x, sy = b.y - a.y;
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-12) return null;
  const qx = a.x - p0.x, qy = a.y - p0.y;
  const t = (qx * sy - qy * sx) / den, u = (qx * ry - qy * rx) / den;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return V2(p0.x + rx * t, p0.y + ry * t);
}
function nearestOnSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 > 0 ? clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l2, 0, 1) : 0;
  return { p: V2(a.x + dx * t, a.y + dy * t), t };
}

// ---------------- 折线 ----------------
function mkPoly(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1], pts[i]));
  return { p: pts, cum, L: cum[cum.length - 1] };
}
function sampleAt(P, s) {
  const { p, cum } = P;
  if (s <= 0) return V2(p[0].x, p[0].y);
  if (s >= P.L) return V2(p[p.length - 1].x, p[p.length - 1].y);
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const seg = cum[hi] - cum[lo];
  return lerp2(p[lo], p[hi], seg > 0 ? (s - cum[lo]) / seg : 0);
}
function subPoly(P, d0, d1) {
  const out = [sampleAt(P, d0)];
  if (d1 >= d0) { for (let i = 0; i < P.p.length; i++) if (P.cum[i] > d0 + 1e-6 && P.cum[i] < d1 - 1e-6) out.push(V2(P.p[i].x, P.p[i].y)); }
  else { for (let i = P.p.length - 1; i >= 0; i--) if (P.cum[i] < d0 - 1e-6 && P.cum[i] > d1 + 1e-6) out.push(V2(P.p[i].x, P.p[i].y)); }
  out.push(sampleAt(P, d1));
  return out;
}
function projectPoly(P, q) {
  let best = { d: 0, dd: Infinity };
  for (let i = 0; i < P.p.length - 1; i++) {
    const n = nearestOnSeg(q, P.p[i], P.p[i + 1]), dd = dist(n.p, q);
    if (dd < best.dd) best = { d: P.cum[i] + n.t * (P.cum[i + 1] - P.cum[i]), dd };
  }
  return best.d;
}

// ---------------- 全局状态 ----------------
const STY = {
  thick: { w: 1.9, c: new THREE.Color(0x777777), k: 0.016 },  // 桥线、框架、辐射丝
  thin:  { w: 1.0, c: new THREE.Color(0x9c9c9c), k: 0.03 },   // 螺旋丝
};
const SLACK = 0.07;   // 正在拖出的丝比较松，下垂更多
const WHITE = new THREE.Color(0xf2f2f2);
const LEG_FEMUR = new THREE.Color(0x141416); // 腿股节，近黑
const LEG_TIBIA = new THREE.Color(0x3e424a); // 腿胫节，冷灰，和木柱的暖棕分开
const PALP_BASE = new THREE.Color(0x4e545e); // 触肢
const PALP_TIP = new THREE.Color(0x8e96a2);
const tmpC = new THREE.Color();

const HIP_A = [0.45, 1.1, 1.95, 2.55];
const FOOT_A = [0.6, 1.32, 2.02, 2.62];
const REACH = [30, 24, 23, 29];
const STEP_T = 0.14;
const PIVOT = -7.5, ABD_LEN = 20.5;   // 腹柄位置、腹柄到纺器的长度（×S）

let W, H, S, SPEED, SPIN, scene, camera, wd, N;
let segs, active, spider, legs, threadQ, legQ, bodyGroup, abdomen, script, finished, grid;
let frame, frameExt, corners, radPoly;
let DT = 0;

// ---------------- 动态四边形网格 ----------------
function makeQuads(cap, z) {
  const pos = new Float32Array(cap * 12), col = new Float32Array(cap * 12), idx = new Uint32Array(cap * 6);
  for (let i = 0; i < cap; i++) { const o = i * 4; idx.set([o, o + 1, o + 2, o, o + 2, o + 3], i * 6); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  mesh.frustumCulled = false;
  mesh.position.z = z;
  return { mesh, geo, pos, col, cap, n: 0 };
}
function quad(Q, ax, ay, bx, by, w, c, ext = 0) {
  if (Q.n >= Q.cap) return;
  let dx = bx - ax, dy = by - ay;
  const L = Math.hypot(dx, dy) || 1e-6;
  dx /= L; dy /= L;
  ax -= dx * ext; ay -= dy * ext; bx += dx * ext; by += dy * ext;
  const nx = -dy * w / 2, ny = dx * w / 2;
  const P = Q.pos, C = Q.col, o = Q.n * 12;
  P[o] = ax + nx; P[o + 1] = ay + ny; P[o + 2] = 0;
  P[o + 3] = bx + nx; P[o + 4] = by + ny; P[o + 5] = 0;
  P[o + 6] = bx - nx; P[o + 7] = by - ny; P[o + 8] = 0;
  P[o + 9] = ax - nx; P[o + 10] = ay - ny; P[o + 11] = 0;
  for (let k = 0; k < 4; k++) { C[o + k * 3] = c.r; C[o + k * 3 + 1] = c.g; C[o + k * 3 + 2] = c.b; }
  Q.n++;
}
function polyQuads(Q, pts, w, c) {
  for (let i = 0; i < pts.length - 1; i++) quad(Q, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, w, c, w / 2);
}
function flush(Q) {
  Q.geo.attributes.position.needsUpdate = true;
  Q.geo.attributes.color.needsUpdate = true;
  Q.geo.setDrawRange(0, Q.n * 6);
}

// ---------------- 场景 ----------------
function init() {
  if (scene) scene.traverse(o => { o.geometry && o.geometry.dispose(); o.material && o.material.dispose(); });
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  S = clamp(Math.min(W, H) / 720, 0.75, 1.6);
  SPEED = 85 * S;
  SPIN = (ABD_LEN - PIVOT) * S;

  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -10, 10);

  const pw = Math.max(14, 22 * S);
  const g = -H / 2, xL = -W / 4 + pw / 2, xR = W / 4 - pw / 2;
  wd = {
    pw, g, xL, xR, off: 9 * S,
    pillars: [[-W / 4 - pw / 2, xL], [xR, W / 4 + pw / 2]],
    y1L: H / 2 - H * rand(0.07, 0.15), y1R: H / 2 - H * rand(0.07, 0.15),
    y2L: g + H * rand(0.2, 0.34), y2R: g + H * rand(0.2, 0.34),
    C: V2(0, 0),
  };

  buildPillars();
  segs = []; active = null; grid = new Map(); radPoly = []; N = 0;
  threadQ = makeQuads(16000, 1);
  legQ = makeQuads(64, 3);
  scene.add(threadQ.mesh, legQ.mesh);
  bodyGroup = makeBody();
  scene.add(bodyGroup);

  spider = { pos: V2(0, g + wd.off), prev: V2(0, g + wd.off), vel: V2(0, 0), heading: Math.PI, bend: 0, mode: 'surface' };
  initLegs();
  script = mainScript();
  finished = false;
}

function buildPillars() {
  const { pw } = wd;
  const rect = (w, x, z, color) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, H), new THREE.MeshBasicMaterial({ color }));
    m.position.set(x, 0, z);
    scene.add(m);
  };
  for (const x of [-W / 4, W / 4]) {
    rect(pw, x, 0, 0x8b5a2b);
    rect(pw * 0.22, x + pw * 0.39, 0.1, 0x6f4622);
    rect(pw * 0.12, x - pw * 0.25, 0.1, 0xa06a3a);
  }
}

function makeBody() {
  const grp = new THREE.Group();
  const geo = new THREE.CircleGeometry(1, 40);
  // z 从后到前错开，重叠处才看得出分界
  const el = (parent, rx, ry, x, y, color, z) => {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
    m.scale.set(rx, ry, 1);
    m.position.set(x, y, z);
    parent.add(m);
  };
  el(grp, 7 * S, 5.8 * S, 0, 0, 0x2a2c32, 0.2);            // 头胸部
  el(grp, 4 * S, 3.6 * S, 5 * S, 0, 0x555b66, 0.45);       // 头部
  el(grp, 0.7 * S, 0.85 * S, 7.6 * S, 1.15 * S, 0xd8dce4, 0.6);
  el(grp, 0.7 * S, 0.85 * S, 7.6 * S, -1.15 * S, 0xd8dce4, 0.6); // 眼
  el(grp, 2.4 * S, 1.8 * S, PIVOT * S, 0, 0x0c0c0e, 0.35);  // 腹柄
  abdomen = new THREE.Group();                              // 腹部可绕腹柄弯曲
  abdomen.position.set(PIVOT * S, 0, 0);
  el(abdomen, 11 * S, 8.5 * S, -10 * S, 0, 0x101012, 0);   // 腹部，主体近黑
  el(abdomen, 6.2 * S, 4.6 * S, -10.6 * S, 0, 0x32363e, 0.08); // 腹部冷灰斑
  el(abdomen, 1.6 * S, 1.4 * S, -(ABD_LEN - 0.5) * S, 0, 0x9aa2ae, 0.25); // 纺器
  grp.add(abdomen);
  grp.position.z = 4;
  return grp;
}

// ---------------- 蛛丝（带重力下垂） ----------------
function curvePts(a, b, k) {
  const L = dist(a, b), n = clamp(Math.ceil(L / 18), 1, 40), h = k * Math.abs(b.x - a.x), out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t - 4 * h * t * (1 - t);
    out.push(V2(clamp(x, wd.xL, wd.xR), Math.max(y, wd.g)));
  }
  return out;
}
const CELL = 48;
const cellKey = (cx, cy) => (cx + 2000) * 8192 + (cy + 2000);
function gridAdd(seg) {
  const P = seg.pts;
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i], b = P[i + 1], e = { seg, a, b };
    const x0 = Math.floor(Math.min(a.x, b.x) / CELL), x1 = Math.floor(Math.max(a.x, b.x) / CELL);
    const y0 = Math.floor(Math.min(a.y, b.y) / CELL), y1 = Math.floor(Math.max(a.y, b.y) / CELL);
    for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
      const key = cellKey(cx, cy);
      let arr = grid.get(key);
      if (!arr) grid.set(key, arr = []);
      arr.push(e);
    }
  }
}
function gridQuery(p, r, fn) {
  const x0 = Math.floor((p.x - r) / CELL), x1 = Math.floor((p.x + r) / CELL);
  const y0 = Math.floor((p.y - r) / CELL), y1 = Math.floor((p.y + r) / CELL);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const arr = grid.get(cellKey(cx, cy));
    if (arr) for (const e of arr) fn(e);
  }
}
function addSeg(a, b, type, meta) {
  const st = STY[type];
  const seg = Object.assign({ a: V2(a.x, a.y), b: V2(b.x, b.y), type, k: SLACK, kT: st.k, fade: 1, removing: false }, meta || {});
  seg.pts = curvePts(seg.a, seg.b, st.k);
  segs.push(seg);
  gridAdd(seg);
  return seg;
}

// ---------------- 蜘蛛身体几何 ----------------
function toWorld(lx, ly) {
  const c = Math.cos(spider.heading), s = Math.sin(spider.heading);
  return V2(spider.pos.x + lx * c - ly * s, spider.pos.y + lx * s + ly * c);
}
function tip() {
  const b = spider.bend;
  return toWorld(PIVOT * S - Math.cos(b) * ABD_LEN * S, -Math.sin(b) * ABD_LEN * S);
}
// 丝的起点 / 终点永远是纺器当前所在的位置
function beginThread(type, p = tip()) { active = { a: V2(p.x, p.y), type }; }
function endThread(meta, p = tip()) {
  if (!active) return null;
  const s = addSeg(active.a, p, active.type, meta);
  active = null;
  return s;
}

// ---------------- 运动协程 ----------------
function surf(p) {
  const q = V2(clamp(p.x, wd.xL, wd.xR), Math.max(p.y, wd.g + wd.off));
  if (p.ev) q.evs = [p.ev];
  return q;
}
function buildPath(pts, r) {
  const out = [V2(pts[0].x, pts[0].y)], vIdx = [0];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], b = pts[i], c = pts[i + 1];
    const la = dist(a, b), lc = dist(b, c), rr = Math.min(r, la * 0.45, lc * 0.45);
    const p1 = lerp2(b, a, rr / la), p2 = lerp2(b, c, rr / lc);
    for (let j = 0; j <= 6; j++) {
      const t = j / 6, u = 1 - t;
      out.push(V2(u * u * p1.x + 2 * u * t * b.x + t * t * p2.x, u * u * p1.y + 2 * u * t * b.y + t * t * p2.y));
      if (j === 3) vIdx.push(out.length - 1);
    }
  }
  out.push(V2(pts[pts.length - 1].x, pts[pts.length - 1].y));
  vIdx.push(out.length - 1);
  const P = mkPoly(out);
  P.vS = vIdx.map(i => P.cum[i]);
  return P;
}
function dirAngle(path, s, look) {
  const a = sampleAt(path, s), b = sampleAt(path, Math.min(path.L, s + look));
  if (dist(a, b) < 1e-3) return spider.heading;
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function* wait(d) { let t = 0; while (t < d) { yield; t += DT; } }
function* turnTo(a, rate = 2.6) {
  while (Math.abs(angDiff(a, spider.heading)) > 0.01) {
    yield;
    spider.heading = approachAngle(spider.heading, a, rate * DT);
  }
  spider.heading = a;
}
// 把腹部压向地面，直到纺器触地
function* bendToGround() {
  spider.bend = 0.3; const yp = tip().y;
  spider.bend = -0.3; const ym = tip().y;
  spider.bend = 0;
  const sgn = yp < ym ? 1 : -1;
  while (tip().y > wd.g + 0.2 && Math.abs(spider.bend) < 1) { yield; spider.bend += sgn * 1.2 * DT; }
}
// 不移动身体时，腹部压到地面后纺器所在的 x
function groundTipX() {
  spider.bend = 0.3; const yp = tip().y;
  spider.bend = -0.3; const ym = tip().y;
  spider.bend = 0;
  const sgn = yp < ym ? 1 : -1;
  while (tip().y > wd.g + 0.2 && Math.abs(spider.bend) < 1) spider.bend += sgn * 0.002;
  const x = tip().x;
  spider.bend = 0;
  return x;
}
// 从桥线松脚：先绕固定点摆到正下方，再受重力竖直放丝下降。丝始终从固定点垂到纺器。
function* dropVertical(anchor, yFloor) {
  spider.mode = 'hang';
  spider.bend = 0;
  let ang = Math.atan2(spider.pos.x - anchor.x, anchor.y - spider.pos.y);
  let R = Math.max(dist(spider.pos, anchor), SPIN + 4 * S);
  let w = 0, t = 0;
  const gSwing = 2200 * S, damp = 3.4;
  while (t < 3.5 && (Math.abs(ang) > 0.02 || Math.abs(w) > 0.08)) {
    yield;
    t += DT;
    w += (-(gSwing / R) * Math.sin(ang) - damp * w) * DT;
    ang += w * DT;
    spider.pos.x = anchor.x + R * Math.sin(ang);
    spider.pos.y = anchor.y - R * Math.cos(ang);
    const hang = Math.atan2(spider.pos.y - anchor.y, spider.pos.x - anchor.x);
    spider.heading = approachAngle(spider.heading, hang, 10 * DT);
  }
  spider.pos.x = anchor.x;
  spider.pos.y = anchor.y - R;
  spider.heading = -Math.PI / 2;

  let vy = 0;
  const gAcc = 2400 * S, vmax = 210 * S, yStop = yFloor + wd.off;
  while (spider.pos.y > yStop + 0.5) {
    yield;
    vy = Math.min(vmax, vy + gAcc * DT);
    const remain = spider.pos.y - yStop;
    if (remain < vmax * 0.4) vy = Math.min(vy, Math.max(remain / 0.4, 50 * S));
    spider.pos.y -= vy * DT;
    spider.pos.x = anchor.x;
    spider.heading = approachAngle(spider.heading, -Math.PI / 2, 8 * DT);
  }
  spider.pos.x = anchor.x;
  spider.pos.y = yStop;
  spider.heading = -Math.PI / 2;
}
function* unbend() {
  while (Math.abs(spider.bend) > 1e-3) { yield; spider.bend = approachAngle(spider.bend, 0, 1.2 * DT); }
  spider.bend = 0;
}

// 路径上的点可以带事件：
//   s     纺器走到该点时触发（身体越过该点一个身长）
//   b     身体走到该点时触发
//   cross 纺器扫过某根辐射丝时触发，回调参数是交点
function* walk(raw, opt = {}) {
  const pts = [];
  for (const r of raw) {
    const p = surf(r), last = pts[pts.length - 1];
    if (last && dist(last, p) < 0.5) { if (p.evs) last.evs = (last.evs || []).concat(p.evs); continue; }
    pts.push(p);
  }
  const ctx = { evs: [], ei: 0, travel: 0, vr: rand(0.93, 1.07) };
  if (pts.length < 2) { for (const p of pts) for (const e of p.evs || []) e.cb(tip()); return; }
  const chunks = [[pts[0]]];
  for (let i = 1; i < pts.length; i++) {
    chunks[chunks.length - 1].push(pts[i]);
    if (i < pts.length - 1) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const turn = Math.abs(angDiff(Math.atan2(c.y - b.y, c.x - b.x), Math.atan2(b.y - a.y, b.x - a.x)));
      if (turn > 1.25) chunks.push([pts[i]]);
    }
  }
  const paths = chunks.map(c => buildPath(c, 10 * S));
  let off = 0;
  paths.forEach((path, ci) => {
    chunks[ci].forEach((p, j) => {
      if (j === 0 && ci > 0) return;
      for (const e of p.evs || []) ctx.evs.push(Object.assign({}, e, { at: off + path.vS[j] }));
    });
    off += path.L;

  while (ctx.ei < ctx.evs.length) ctx.evs[ctx.ei++].cb(tip());
}
function fireEvents(ctx, p0, p1) {
  while (ctx.ei < ctx.evs.length) {
    const e = ctx.evs[ctx.ei];
    let hit = null;
    if (e.kind === 'b') { if (ctx.travel >= e.at) hit = p1; }
    else if (e.kind === 's') { if (ctx.travel - SPIN >= e.at) hit = p1; }
    else {
      for (let i = 0; i < e.poly.length - 1 && !hit; i++) hit = segIntersect(p0, p1, e.poly[i], e.poly[i + 1]);
      if (!hit && ctx.travel - SPIN >= e.at + 15 * S) hit = p1;

function* walkChunk(path, opt, ctx) {

  if (path.L < 0.3) { ctx.travel = base + path.L; const t = tip(); fireEvents(ctx, t, t); return; }
  const look = 12 * S;
  const a0 = dirAngle(path, 0, look);
  if (Math.abs(angDiff(a0, spider.heading)) > 0.3) yield* turnTo(a0);
  if (opt.mode) spider.mode = opt.mode;
  const v = SPEED * (opt.speedK || 1) * ctx.vr;
  let s = 0, t = 0, prevTip = tip();
  while (s < path.L) {
    yield;
    t += DT;
    const k = Math.min(1, 0.25 + t / 0.35, 0.25 + (path.L - s) / (v * 0.3));
    s = Math.min(path.L, s + v * k * DT);
    const p = sampleAt(path, s);
    spider.pos.x = p.x; spider.pos.y = p.y;
    if (path.L - s > 0.5) spider.heading = approachAngle(spider.heading, dirAngle(path, s, look), 5 * DT);
    ctx.travel = base + s;
    const tp = tip();
    fireEvents(ctx, prevTip, tp);
    prevTip = tp;
  }
}

// ---------------- 框架（闭合折线） ----------------
function buildFrame(pts) {
  const clean = [];
  for (const p of pts) if (!clean.length || dist(clean[clean.length - 1], p) > 0.5) clean.push(V2(p.x, p.y));
  if (dist(clean[0], clean[clean.length - 1]) < 0.5) clean.pop();
  frame = mkPoly([...clean, clean[0]]);
  frame.P = frame.L;
  frameExt = mkPoly([...clean, ...clean, clean[0]]);
  corners = [];
  const n = clean.length;
  for (let i = 0; i < n; i++) {
    const a = clean[mod(i - 1, n)], b = clean[i], c = clean[(i + 1) % n];
    const turn = Math.abs(angDiff(Math.atan2(c.y - b.y, c.x - b.x), Math.atan2(b.y - a.y, b.x - a.x)));
    if (turn > 0.45) corners.push(frame.cum[i]);
  }
}
function rayFrame(c, ang) {
  const far = V2(c.x + Math.cos(ang) * 1e5, c.y + Math.sin(ang) * 1e5);
  let best = null;
  for (let i = 0; i < frame.p.length - 1; i++) {
    const h = segIntersect(c, far, frame.p[i], frame.p[i + 1]);
    if (h && (!best || dist(c, h) < best.t)) best = { t: dist(c, h), u: frame.cum[i] + dist(frame.p[i], h) };
  }
  return best;
}
// 锚点离框架拐角至少一个身长，蜘蛛越过锚点时不会绕到拐角另一边
function avoidCorners(u, D) {
  const P = frame.P;
  for (let it = 0; it < 4; it++) {
    let moved = false;
    for (const c of corners) {
      const dd = angDiffU(u, c, P);
      if (Math.abs(dd) < D) { u = mod(c + (dd >= 0 ? D : -D), P); moved = true; }
    }
    if (!moved) return u;
  }
  return corners.every(c => Math.abs(angDiffU(u, c, P)) >= D - 1) ? u : null;
}
function angDiffU(u, c, P) { let d = mod(u - c, P); if (d > P / 2) d -= P; return d; }
// 沿框架从 ua 走到 ub（较短方向），再继续往前走 ext
function perimWalk(ua, ub, ext) {
  const P = frame.P, a = mod(ua, P), df = mod(ub - ua, P);
  if (df <= P / 2) return { to: subPoly(frameExt, a, a + df), ext: subPoly(frameExt, a + df, a + df + ext) };
  const db = P - df;
  return { to: subPoly(frameExt, a + P, a + P - db), ext: subPoly(frameExt, a + P - db, a + P - db - ext) };
}

// ---------------- 螺旋 ----------------
let Rin = 1;
function radAt(k, d) { const R = radPoly[k]; return sampleAt(R, Math.min(d, R.L * 0.97)); }
function dOfF(k, f) { return f * (Rin + (radPoly[k].L - Rin) * f); }

function* spiralWalk(seq, type, onRelay) {
  const n = seq.length - 2;
  const raw = [V2(spider.pos.x, spider.pos.y)];
  for (let i = 0; i <= n; i++) {
    const q = V2(seq[i].x, seq[i].y);
    q.ev = { kind: 'cross', poly: radPoly[seq[i].k].p,
      cb: i === 0 ? h => beginThread(type, h) : h => onRelay(i, h) };
    raw.push(q);
  }
  const a = seq[n], b = seq[n + 1], e = (SPIN + 6 * S) / (dist(a, b) || 1);
  raw.push(V2(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e));
  yield* walk(raw);
  active = null;
}

// ---------------- 结网脚本 ----------------
function* mainScript() {
  const { g, xL, xR } = wd;
  const P = () => V2(spider.pos.x, spider.pos.y);
  const pause = () => wait(rand(0.2, 0.35));

  setPhase('准备中…');
  yield* wait(0.8);

  setPhase('① 架设桥线：爬上左柱固定丝线，拖着丝走到右柱并拉紧');
  yield* walk([P(), V2(xL, g), V2(xL, wd.y1L + SPIN)]);
  yield* pause();
  beginThread('thick');
  yield* pause();
  yield* walk([P(), V2(xL, g), V2(xR, g), V2(xR, wd.y1R + SPIN)]);
  yield* pause();
  const bridge = endThread();
  yield* wait(0.4);

  setPhase('② 沿桥线走到中点，固定后垂丝下降到地面，形成中轴线');
  const bp = mkPoly(bridge.pts);
  const dM = bp.L * rand(0.42, 0.58);
  {
    const to = subPoly(bp, bp.L, dM), ext = subPoly(bp, dM, dM - SPIN - 3 * S);
    const tgt = to[to.length - 1];

  }

  yield* dropVertical(M, g);
  spider.mode = 'surface';
  yield* wait(0.15);
  yield* turnTo(Math.PI);
  // 挪一小步，让纺器触地点正好在固定点正下方，中轴线保持竖直
  yield* walk([P(), V2(spider.pos.x - (groundTipX() - M.x), g)]);
  yield* bendToGround();
  const vertical = endThread();
  beginThread('thick');
  const G0 = V2(vertical.b.x, vertical.b.y);
  yield* pause();
  yield* unbend();

  setPhase('③ 搭建框架线：从地面锚点分别拉丝到两侧柱子');
  yield* walk([P(), V2(xL, g), V2(xL, wd.y2L + SPIN)]);
  yield* pause();
  const botL = endThread();
  yield* pause();
  const blp = mkPoly(botL.pts);
  yield* walk([P(), V2(botL.b.x, botL.b.y), ...subPoly(blp, blp.L, 0).slice(1), V2(G0.x + SPIN + rand(8, 16) * S, g)]);
  yield* bendToGround();
  beginThread('thick');
  yield* pause();
  yield* unbend();
  yield* walk([P(), V2(xR, g), V2(xR, wd.y2R + SPIN)]);
  yield* pause();
  const botR = endThread();
  yield* pause();

  const vp = mkPoly(vertical.pts);
  const yC = M.y - (M.y - g) * rand(0.38, 0.46);
  let dC = vp.L / 2;
  for (let i = 0; i < vp.p.length - 1; i++) {
    const a = vp.p[i], b = vp.p[i + 1];
    if ((a.y - yC) * (b.y - yC) <= 0) { dC = vp.cum[i] + (a.y - yC) / ((a.y - b.y) || 1e-9) * (vp.cum[i + 1] - vp.cum[i]); break; }
  }
  const C = sampleAt(vp, dC);
  wd.C = C;
  const brp = mkPoly(botR.pts);
  yield* walk([P(), V2(botR.b.x, botR.b.y), ...subPoly(brp, brp.L, 0).slice(1), V2(G0.x, g), ...subPoly(vp, vp.L, dC).slice(1)]);

  setPhase('④ 铺设辐射丝：从中心沿已有辐射丝走到框架，在新位置固定后沿新丝返回');
  buildFrame([...bridge.pts, botR.b, ...botR.pts.slice().reverse(), ...botL.pts]);
  const thU = Math.atan2(M.y - C.y, M.x - C.x), thD = Math.atan2(G0.y - C.y, G0.x - C.x);
  const spanL = mod(thD - thU, TAU), spanR = TAU - spanL;
  const nL = randi(9, 13), nR = randi(9, 13), D = SPIN + 12 * S, E = SPIN + 4 * S;
  const plan = [
    { th: thU, built: true, poly: mkPoly(subPoly(vp, dC, 0)), u: projectPoly(frame, M) },
    { th: thD, built: true, poly: mkPoly(subPoly(vp, dC, vp.L)), u: projectPoly(frame, G0) },
  ];
  const addTargets = (start, span, n) => {
    for (let i = 1; i <= n; i++) {
      const th = start + span * (i + rand(-0.3, 0.3)) / (n + 1);
      const hit = rayFrame(C, th);
      if (!hit) continue;
      const u = avoidCorners(hit.u, D);
      if (u === null) continue;
      const p = sampleAt(frame, u);
      plan.push({ th: Math.atan2(p.y - C.y, p.x - C.x), built: false, u });
    }
  };
  addTargets(thU, spanL, nL);
  addTargets(thD, spanR, nR);
  plan.sort((a, b) => mod(a.th - thU, TAU) - mod(b.th - thU, TAU));
  for (let i = 1; i < plan.length; i++) {
    if (!plan[i].built && Math.abs(angDiff(plan[i].th, plan[i - 1].th)) < 0.08) plan.splice(i--, 1);
  }
  N = plan.length;
  plan.forEach((r, k) => { if (r.built) radPoly[k] = r.poly; });

  while (plan.some(r => !r.built)) {
    let best = null, bestGap = -1;
    for (const r of plan) {
      if (r.built) continue;
      const gap = Math.min(...plan.filter(q => q.built).map(q => Math.abs(angDiff(r.th, q.th)))) + rand(0, 0.05);
      if (gap > bestGap) { bestGap = gap; best = r; }
    }
    let nb = null;
    for (const q of plan) if (q.built && (!nb || Math.abs(angDiff(best.th, q.th)) < Math.abs(angDiff(best.th, nb.th)))) nb = q;
    const k = plan.indexOf(best), kb = plan.indexOf(nb);

    const hub = V2(C.x, C.y);
    hub.ev = { kind: 's', cb: h => beginThread('thick', h) };
    const pw = perimWalk(nb.u, best.u, E);
    const tgt = pw.to[pw.to.length - 1];
    tgt.ev = { kind: 's', cb: h => {
      const seg = endThread(null, h);
      radPoly[k] = mkPoly(seg.pts);
      best.anchor = h;
    } };
    yield* walk([P(), hub, ...radPoly[kb].p.slice(1), ...pw.to, ...pw.ext.slice(1)]);
    best.built = true;
    yield* pause();
    const back = pw.ext.slice().reverse();
    yield* walk([P(), ...back.slice(1), best.anchor, ...radPoly[k].p.slice().reverse().slice(1), V2(C.x, C.y)]);
    yield* wait(rand(0.1, 0.3));

  Rin = Math.min(...radPoly.map(r => r.L));

  setPhase('⑤ 先织中心，再由内向外铺设稀疏的辅助螺旋丝（临时脚手架）');
  const k0 = randi(0, N - 1);
  const seq = [];
  {
    let k = k0;
    const hubSteps = Math.round(rand(2.2, 2.8) * N), d0 = 1.25 * SPIN, d1 = 2.1 * SPIN;
    for (let i = 0; i <= hubSteps; i++) { seq.push(spiralPoint(k, d0 + (d1 - d0) * i / hubSteps, 0)); k = (k + 1) % N; }
    let f = (d1 + 10 * S) / Rin, sp = rand(0.09, 0.13), n = 0;
    const fEnd = rand(0.74, 0.82);
    while (f < fEnd) {
      const fj = f + rand(-0.004, 0.004);
      seq.push(spiralPoint(k, dOfF(k, fj), fj));
      k = (k + 1) % N; f += sp / N;
      if (++n % N === 0) sp = rand(0.09, 0.13);
    }
    seq.push(spiralPoint(k, dOfF(k, f), f));
    seq.hubEnd = hubSteps;

  yield* walk([P(), ...subPoly(radPoly[k0], 0, seq[0].d).slice(1)]);
  yield* spiralWalk(seq, 'thin', (i, h) => {
    if (!active) return;
    addSeg(active.a, h, 'thin', { aux: i > seq.hubEnd, idx: i, sector: seq[i - 1].k, f: seq[i].f });
    active.a = h;
  });
  yield* pause();

  setPhase('⑥ 由外向内铺设密集的捕虫螺旋丝，边走边拆除辅助螺旋丝');
  const lastAux = seq[seq.length - 2];
  const k1 = (lastAux.k + 1) % N;
  const fCap0 = rand(0.86, 0.92), fCapEnd = rand(0.24, 0.3);
  yield* walk([P(), ...subPoly(radPoly[k1], dOfF(k1, lastAux.f), dOfF(k1, fCap0))]);
  const cap = [];
  {
    let k = k1, f = fCap0, sp = rand(0.022, 0.032), n = 0;
    while (f > fCapEnd) {
      const fj = f + rand(-0.003, 0.003);
      cap.push(spiralPoint(k, dOfF(k, fj), fj));
      k = (k + 1) % N; f -= sp / N;
      if (++n % N === 0) sp = rand(0.022, 0.032);
    }
    cap.push(spiralPoint(k, dOfF(k, f), f));
  }
  yield* spiralWalk(cap, 'thin', (i, h) => {
    if (!active) return;
    addSeg(active.a, h, 'thin');
    active.a = h;
    const sector = cap[i - 1].k, f = cap[i].f;
    for (const s of segs) if (s.aux && !s.removing && s.sector === sector && s.f >= f - 0.004) s.removing = true;
  });
  yield* pause();

  setPhase('⑦ 沿剩余的辅助螺旋丝向中心走，边走边吃掉它');
  const remain = segs.filter(s => s.aux && !s.removing).map(s => s.idx);
  const kh = seq[seq.hubEnd].k;
  const raw = [P()];
  if (remain.length) {
    const jmax = Math.max(...remain);
    for (let i = jmax; i >= seq.hubEnd; i--) {
      const q = V2(seq[i].x, seq[i].y);
      if (i < jmax) {
        const idx = i + 1;
        q.ev = { kind: 'b', cb: () => { for (const s of segs) if (s.aux && s.idx === idx) s.removing = true; } };
      }
      raw.push(q);
    }
  } else raw.push(V2(seq[seq.hubEnd].x, seq[seq.hubEnd].y));
  raw.push(...subPoly(radPoly[kh], seq[seq.hubEnd].d, 0).slice(1), V2(C.x, C.y));
  yield* walk(raw);
  yield* turnTo(-Math.PI / 2);
  setPhase('完成：蜘蛛回到网中心，头朝下等待猎物');
}

// ---------------- 腿：寻找真实落脚点 + 交替步态 + 两段 IK ----------------
function hipLocal(l) { const r = 4.5 * S, a = HIP_A[l.i]; return [Math.cos(a) * r, l.side * Math.sin(a) * r]; }
function hipWorld(l) { const [x, y] = hipLocal(l); return toWorld(x, y); }
function legLen(l) { return REACH[l.i] * S * 1.3; }
function legRest(l, k) {
  const [hx, hy] = hipLocal(l), a = FOOT_A[l.i], R = REACH[l.i] * S * k;
  return toWorld(hx + Math.cos(a) * R, hy + l.side * Math.sin(a) * R);
}
// 落脚点只能是：地面、柱子表面、已经固定好的蛛丝
function findFoothold(rest, hip, reach) {
  let best = null, bd = Infinity, bseg = null;
  const consider = (q, seg) => {
    if (dist(q, hip) > reach) return;
    const d = dist(q, rest);
    if (d < bd) { bd = d; best = q; bseg = seg; }
  };
  consider(V2(rest.x, wd.g), null);
  for (const [x0, x1] of wd.pillars) consider(V2(clamp(rest.x, x0, x1), clamp(rest.y, wd.g, H / 2)), null);
  gridQuery(hip, reach, e => { if (!e.seg.removing) consider(nearestOnSeg(rest, e.a, e.b).p, e.seg); });
  return best ? { p: best, seg: bseg } : null;
}
function initLegs() {
  legs = [];
  for (const side of [1, -1]) for (let i = 0; i < 4; i++) {
    const l = { side, i, group: ((i % 2) === 0) === (side === 1) ? 0 : 1, stepping: false, t: 0, free: true, seg: null, timer: 0 };
    const rest = legRest(l, 1), fh = findFoothold(rest, hipWorld(l), legLen(l) * 0.95);
    l.foot = fh ? fh.p : legRest(l, 0.68);
    l.free = !fh;
    l.plantVec = V2(l.foot.x - rest.x, l.foot.y - rest.y);

}
function startStep(l, fh) {
  l.stepping = true; l.t = 0; l.from = V2(l.foot.x, l.foot.y);
  if (fh) { l.to = fh.p; l.seg = fh.seg; l.toFree = false; }
  else { l.to = null; l.seg = null; l.toFree = true; }
}
function updateLegs(dt) {
  const sp = spider, k = Math.min(1, dt * 15);
  sp.vel.x += ((sp.pos.x - sp.prev.x) / dt - sp.vel.x) * k;
  sp.vel.y += ((sp.pos.y - sp.prev.y) / dt - sp.vel.y) * k;
  sp.prev = V2(sp.pos.x, sp.pos.y);

  for (const l of legs) if (l.stepping) busy[l.group] = true;
  const ahead = (p) => V2(p.x + sp.vel.x * STEP_T * 0.9, p.y + sp.vel.y * STEP_T * 0.9);
  for (const l of legs) {
    const rest = legRest(l, 1);
    if (sp.mode === 'hang') {
      // 悬丝下降：腿收拢
      l.stepping = false; l.free = true; l.seg = null;
      l.foot = lerp2(l.foot, legRest(l, 0.68), 1 - Math.exp(-12 * dt));

    }
    if (l.stepping) {
      l.t += dt / STEP_T;

      if (l.t >= 1) {

        l.free = l.toFree;
        l.plantVec = V2(l.foot.x - rest.x, l.foot.y - rest.y);

      continue;
    }
    if (l.free) {
      l.foot = lerp2(l.foot, legRest(l, 0.68), 1 - Math.exp(-12 * dt));
      l.timer -= dt;
      if (l.timer <= 0 && !busy[1 - l.group]) {
        l.timer = 0.1;

        if (fh) { startStep(l, fh); busy[l.group] = true; }
      }
      continue;
    }
    const drift = Math.hypot(l.foot.x - rest.x - l.plantVec.x, l.foot.y - rest.y - l.plantVec.y);
    const over = dist(hipWorld(l), l.foot) > legLen(l);
    const lost = l.seg && l.seg.removing;
    if ((drift > thr && !busy[1 - l.group]) || drift > thr * 2.5 || over || lost) {

function drawLegs() {

    const tot = legLen(l), l1 = tot * 0.47, l2 = tot * 0.53;

    const base = Math.atan2(f.y - hip.y, f.x - hip.x);

    const k1 = V2(hip.x + Math.cos(base + a) * l1, hip.y + Math.sin(base + a) * l1);
    const k2 = V2(hip.x + Math.cos(base - a) * l1, hip.y + Math.sin(base - a) * l1);
    const knee = dist(k1, spider.pos) > dist(k2, spider.pos) ? k1 : k2;
    quad(legQ, hip.x, hip.y, knee.x, knee.y, 2.6 * S, LEG_FEMUR, 1.3 * S);
    quad(legQ, knee.x, knee.y, f.x, f.y, 1.7 * S, LEG_TIBIA, 0.85 * S);
  }
  for (const sd of [1, -1]) {
    const a = toWorld(6 * S, sd * 2.2 * S), b = toWorld(10.5 * S, sd * 4.2 * S), c = toWorld(13 * S, sd * 2.8 * S);
    quad(legQ, a.x, a.y, b.x, b.y, 1.8 * S, PALP_BASE, 0.9 * S);
    quad(legQ, b.x, b.y, c.x, c.y, 1.4 * S, PALP_TIP, 0.7 * S);
  }
  flush(legQ);
}
function drawThreads() {
  threadQ.n = 0;
  for (const s of segs) {
    const st = STY[s.type];
    let c = st.c, w = st.w;
    if (s.fade < 1) { c = tmpC.copy(st.c).lerp(WHITE, 1 - s.fade); w *= 0.5 + 0.5 * s.fade; }
    polyQuads(threadQ, s.k > s.kT ? curvePts(s.a, s.b, s.k) : s.pts, w, c);
  }
  if (active) { const st = STY[active.type]; polyQuads(threadQ, curvePts(active.a, tip(), SLACK), st.w, st.c); }
  flush(threadQ);
}

// ---------------- 主循环 ----------------
function step(h) {
  DT = h;
  if (!finished && script.next().done) finished = true;
  updateLegs(h);
  let dead = false;
  for (const s of segs) {
    if (s.k > s.kT) s.k = Math.max(s.kT, s.k - h * SLACK / 0.5);   // 固定后被拉紧
    if (s.removing) { s.fade -= h * 2.5; if (s.fade <= 0) dead = true; }
  }
  if (dead) segs = segs.filter(s => s.fade > 0);
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  let sim = dt * speedMul;
  while (sim > 1e-6) { const h = Math.min(sim, 1 / 120); sim -= h; step(h); }
  bodyGroup.position.set(spider.pos.x, spider.pos.y, 4);
  bodyGroup.rotation.z = spider.heading;
  abdomen.rotation.z = spider.bend;
  drawThreads();
  drawLegs();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(init, 300); });

init();
requestAnimationFrame(loop);
</script>
